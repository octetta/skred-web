<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="coi-serviceworker.min.js"></script>
    <script>
        (function() {
            try {
                var f = localStorage.getItem('skred_font');
                if (f === 'mono' || f === 'monospace') {
                    document.documentElement.style.setProperty('--main-font', 'monospace');
                    document.documentElement.style.setProperty('--main-font-weight', 'bold');
                    document.documentElement.style.setProperty('--main-line-height', '1.25');
                } else {
                    document.documentElement.style.setProperty('--main-font', "'Press Start 2P', monospace");
                    document.documentElement.style.setProperty('--main-font-weight', 'normal');
                    document.documentElement.style.setProperty('--main-line-height', '1.5');
                }
                var t = localStorage.getItem('skred_theme');
                if (t === 'light') {
                    document.documentElement.dataset.theme = 'light';
                } else {
                    document.documentElement.dataset.theme = 'dark';
                }
            } catch (e) {}
        })();
    </script>
    <title>skred-web shell</title>
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="osko.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root {
    --main-font: 'Press Start 2P', monospace;
    --main-font-weight: normal;
    --main-line-height: 1.5;

    /* Theme colors - Dark (default Atari) */
    --page-bg: #000000;
    --term-bg: #0042ff;
    --term-text: #90b0ff;
    --input-bg: #001a66;
    --input-text: #ffffff;
    --bar-bg: #1a2a1a;
    --bar-border: rgba(144, 176, 255, 0.3);
    --bar-shadow: rgba(0, 0, 0, 0.5);
    --bar-btn-text: #90b0ff;
    --bar-btn-border: rgba(144, 176, 255, 0.2);
    --bar-btn-active-bg: #90b0ff;
    --bar-btn-active-text: #001a66;
    --slider-row-border: rgba(144, 176, 255, 0.12);
    --status-bg: #90b0ff;
    --status-text: #001a66;
    --status-center: #0030cc;
    --status-audio: #0042ff;
    --status-border: #000000;
    --slider-thumb: #90b0ff;
    --slider-toggle: #cc0033;

    --color-system: #ffd700;
    --color-error: #FF3C3C;
    --color-info: #afff00;
    --color-dim: #ffffff;

    --graph-bg: rgba(0, 26, 102, 0.5);
    --graph-border: rgba(144, 176, 255, 0.55);
    --graph-edge: #90b0ff;
    --graph-edge-text: #ffffff;
    --graph-edge-stroke: #001a66;
    --graph-node-fill: #001a66;
    --graph-node-stroke: #90b0ff;
    --graph-root-fill: #332b00;
    --graph-root-stroke: #ffd700;
    --graph-node-text: #ffffff;

    /* Editor & Split Colors - Dark (Atari) */
    --editor-bg: #002db3;
    --editor-text: #ffffff;
    --editor-toolbar-bg: #002080;
    --editor-toolbar-text: #ffd700;
    --editor-border: rgba(144, 176, 255, 0.4);
    --editor-btn-bg: #0036cc;
    --editor-btn-border: rgba(144, 176, 255, 0.5);
    --editor-btn-text: #ffffff;
    --divider-bg: #002080;
    --divider-border: rgba(144, 176, 255, 0.35);
    --divider-handle: #ffd700;

    /* Attached Files Tray Colors - Dark (Atari) */
    --tray-bg: #002699;
    --tray-border: #3b6eff;
    --tray-item-bg: #0038d1;
    --tray-item-border: rgba(144, 176, 255, 0.6);
    --tray-item-text: #ffffff;
    --tray-item-hover-bg: #004aff;

    /* Backward compatibility aliases */
    --atari-blue: var(--term-bg);
    --atari-dark: var(--input-bg);
    --atari-gold: var(--color-system);
    --atari-light: var(--term-text);
    --atari-rust: var(--color-error);
    --atari-grass: var(--color-info);
}

[data-theme="light"] {
    /* Theme colors - Light (Erasmus) */
    --page-bg: #ffffff;
    --term-bg: #ffffff;
    --term-text: #2d3748;
    --input-bg: #f3f4f6;
    --input-text: #111827;
    --bar-bg: #e5e7eb;
    --bar-border: rgba(0, 0, 0, 0.15);
    --bar-shadow: rgba(0, 0, 0, 0.08);
    --bar-btn-text: #374151;
    --bar-btn-border: rgba(0, 0, 0, 0.12);
    --bar-btn-active-bg: #ff1493;
    --bar-btn-active-text: #ffffff;
    --slider-row-border: rgba(0, 0, 0, 0.08);
    --status-bg: #ededed;
    --status-text: #1f2937;
    --status-center: #ff1493;
    --status-audio: #1f2937;
    --status-border: #cbd5e1;
    --slider-thumb: #ff1493;
    --slider-toggle: #ff1493;

    --color-system: #d97706;
    --color-error: #dc2626;
    --color-info: #16a34a;
    --color-dim: #64748b;

    --graph-bg: rgba(243, 244, 246, 0.95);
    --graph-border: rgba(0, 0, 0, 0.18);
    --graph-edge: #1e90ff;
    --graph-edge-text: #111827;
    --graph-edge-stroke: #ffffff;
    --graph-node-fill: #ffffff;
    --graph-node-stroke: #1e90ff;
    --graph-root-fill: #fef3c7;
    --graph-root-stroke: #d97706;
    --graph-node-text: #111827;

    /* Editor & Split Colors - Light (Erasmus) */
    --editor-bg: #ffffff;
    --editor-text: #0f172a;
    --editor-toolbar-bg: #f1f5f9;
    --editor-toolbar-text: #0f172a;
    --editor-border: #cbd5e1;
    --editor-btn-bg: #ffffff;
    --editor-btn-border: #cbd5e1;
    --editor-btn-text: #1e293b;
    --divider-bg: #e2e8f0;
    --divider-border: #cbd5e1;
    --divider-handle: #64748b;

    /* Attached Files Tray Colors - Light (Erasmus) */
    --tray-bg: #f8fafc;
    --tray-border: #cbd5e1;
    --tray-item-bg: #ffffff;
    --tray-item-border: #94a3b8;
    --tray-item-text: #0f172a;
    --tray-item-hover-bg: #f1f5f9;

    --atari-blue: var(--term-bg);
    --atari-dark: var(--input-bg);
    --atari-gold: var(--color-system);
    --atari-light: var(--term-text);
    --atari-rust: var(--color-error);
    --atari-grass: var(--color-info);
}

body {
    background-color: var(--page-bg); 
    display: flex;
    flex-direction: column;
    height: 100dvh; 
    margin: 0;
    overflow: hidden; 
}

#terminal-container {
    background-color: var(--term-bg);
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: manipulation;
}

#output {
    flex-grow: 1;
    overflow-y: auto;
    padding: 20px;
    white-space: pre-wrap;
    line-height: var(--main-line-height, 1.5);
    -webkit-overflow-scrolling: touch;
    touch-action: manipulation;
}

.terminal-spacer {
    height: 70%;
    width: 100%;
}

/* Function Bar: Text-field style between entry and status */
#function-bar {
    display: flex;
    background: var(--bar-bg);
    border-top: 1px solid var(--bar-border);
    flex-shrink: 0;
    height: 44px;
    align-items: stretch;
    box-shadow: inset 0 2px 5px var(--bar-shadow); 
}

#slider-bar {
    display: flex;
    flex-direction: column;
    background: var(--bar-bg);
    border-top: 1px solid var(--bar-border);
    flex-shrink: 0;
    height: 176px;
    align-items: stretch;
    gap: 0;
    box-shadow: inset 0 2px 5px var(--bar-shadow);
}

#slider-bar.slider-hidden {
    display: none;
}

.slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 10px;
    border-top: 1px solid var(--slider-row-border);
}

.slider-row:first-child {
    border-top: none;
}

#function-bar button {
    background: transparent;
    border: none;
    border-right: 1px solid var(--bar-btn-border);
    color: var(--bar-btn-text);
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-weight: var(--main-font-weight, normal);
    font-size: 11px;
    cursor: pointer;
    flex: 1;
    transition: background 0.1s;
    outline: none;
    white-space: nowrap;
}

#slider-bar input {
    background: transparent;
    border: none;
    border-right: 1px solid var(--bar-btn-border);
    color: var(--input-text);
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-weight: var(--main-font-weight, normal);
    font-size: 10px;
    outline: none;
    height: 100%;
    min-width: 0;
}

#slider-bar input[type="number"] {
    appearance: textfield;
    -moz-appearance: textfield;
}

#slider-bar input[type="number"]::-webkit-outer-spin-button,
#slider-bar input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.slider-cmd { flex: 2; }
.slider-min, .slider-max, .slider-step { flex: 0 0 78px; text-align: center; }
.cmd-slider { flex: 3; accent-color: var(--slider-thumb); }

#function-bar button:active {
    background: var(--bar-btn-active-bg);
    color: var(--bar-btn-active-text);
}

.input-line {
    display: flex;
    align-items: center;
    padding: 15px 20px;
    background: var(--input-bg);
    flex-shrink: 0;
    touch-action: manipulation;
}

#output, #cmdInput, .prompt, .status-bar, .extra-line {
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-weight: var(--main-font-weight, normal);
    font-size: 16px; 
    color: var(--term-text);
}

#cmdInput {
    background: transparent;
    border: none;
    outline: none;
    flex-grow: 1;
    color: var(--input-text);
    font-size: 16px;          /* keep ≥16px always – prevents iOS zoom */
    line-height: var(--main-line-height, 1.5);
}

#cmdInput::placeholder {
    color: var(--input-text);
    opacity: 0.45;
}

.prompt {
    line-height: var(--main-line-height, 1.5);
}

.status-bar {
    padding: 10px 20px;
    background: var(--status-bg);
    color: var(--status-text);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    font-size: 12px;
    border-top: 2px solid var(--status-border);
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
}

#engine-left { flex: 1; white-space: nowrap; }
#engine-center { 
    flex: 2; 
    font-size: 9px; 
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--status-center);
}
#engine-status {
    flex: 1;
    color: var(--status-audio);
    text-align: right;
    white-space: nowrap;
}

#engine-right {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

#slider-toggle, #clip-toggle, #split-toggle, #files-toggle {
    background: transparent;
    border: none;
    color: var(--slider-toggle);
    cursor: pointer;
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-weight: var(--main-font-weight, normal);
    font-size: 11px;
    line-height: 1;
    padding: 0 2px;
    margin: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
}

#slider-toggle:hover, #clip-toggle:hover, #split-toggle:hover, #files-toggle:hover {
    filter: brightness(1.2);
}

#slider-toggle.active, #clip-toggle.active, #split-toggle.active, #files-toggle.active {
    color: var(--color-system);
}

/* ---------- Mobile improvements ---------- */
@media (max-width: 600px) {
    #output, .prompt {
        font-size: 12px;
    }

    .logo-art {
        font-family: monospace;
        font-weight: bold;
        font-size: 10px;
        line-height: 1.15;
    }

    /* Critical: never drop #cmdInput below 16px or iOS will zoom */
    #cmdInput {
        font-size: 16px;
    }

    .status-bar {
        font-size: 9px;
        padding: 8px 12px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }

    .input-line {
        padding: 12px 14px;
    }

    #output {
        padding: 12px;
    }

    .terminal-spacer {
        height: 40%;          /* less aggressive on short viewports */
    }

    /* Function bar: allow horizontal scroll so buttons stay tappable */
    #function-bar {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }
    #function-bar::-webkit-scrollbar {
        display: none;
    }
    #function-bar button {
        flex: 0 0 auto;
        min-width: 36px;
        padding: 0 8px;
        font-size: 10px;
    }

    .slider-row {
        gap: 4px;
        padding: 0 6px;
    }
    #slider-bar input {
        font-size: 9px;
    }
    .slider-min, .slider-max, .slider-step {
        flex-basis: 52px;
    }
}

.system { color: var(--color-system); }
.error { color: var(--color-error); }
.info { color: var(--color-info); }
.dim { color: var(--color-dim); }
.logo-art {
    margin: 6px 0;
    line-height: 1.15;
    letter-spacing: 0;
    white-space: pre;
    font-family: monospace;
    font-weight: bold;
}

.logo-banner {
    display: block;
    margin: 8px 0;
}

.osko-mascot {
    image-rendering: -webkit-optimize-contrast;
    image-rendering: -moz-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 96px;
    height: 96px;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    display: inline-block;
}

.voice-graph-output {
    margin: 8px 0 14px;
    padding: 10px;
    overflow-x: auto;
    background: var(--graph-bg);
    border: 1px solid var(--graph-border);
    white-space: normal;
}

.voice-graph-title {
    margin-bottom: 8px;
    color: var(--color-system);
    font-size: 11px;
}

.voice-graph-output svg {
    display: block;
    width: auto;
    max-width: none;
    height: auto;
    overflow: visible;
}

.voice-graph-edge {
    fill: none;
    stroke: var(--graph-edge);
    stroke-width: 1.5;
    opacity: 0.85;
}

.voice-graph-arrow {
    fill: var(--graph-edge);
}

.voice-graph-edge-label {
    fill: var(--graph-edge-text);
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-weight: var(--main-font-weight, normal);
    font-size: 6px;
    text-anchor: middle;
    paint-order: stroke;
    stroke: var(--graph-edge-stroke);
    stroke-width: 3px;
    stroke-linejoin: round;
}

.voice-graph-node circle {
    fill: var(--graph-node-fill);
    stroke: var(--graph-node-stroke);
    stroke-width: 2;
}

.voice-graph-node.root circle {
    fill: var(--graph-root-fill);
    stroke: var(--graph-root-stroke);
}

.voice-graph-node text {
    fill: var(--graph-node-text);
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-weight: var(--main-font-weight, normal);
    font-size: 8px;
    text-anchor: middle;
    dominant-baseline: central;
}

/* App Split Screen Layout */
#app-split-container {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
}

#editor-pane {
    display: flex;
    flex-direction: column;
    background: var(--editor-bg);
    border-bottom: 1px solid var(--editor-border);
    flex-shrink: 0;
    min-height: 70px;
    height: 220px;
    max-height: calc(100dvh - 160px);
    overflow: hidden;
}

#editor-pane.editor-hidden {
    display: none !important;
}

#editor-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--editor-toolbar-bg);
    border-bottom: 1px solid var(--editor-border);
    padding: 7px 14px;
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-size: 10px;
    color: var(--editor-toolbar-text);
    flex-shrink: 0;
    gap: 8px;
    user-select: none;
}

.editor-title {
    font-weight: bold;
    color: var(--color-system);
    white-space: nowrap;
}

.editor-hint {
    font-size: 8px;
    opacity: 0.85;
    color: var(--term-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.editor-actions {
    display: flex;
    gap: 6px;
    align-items: center;
}

.editor-btn {
    background: var(--editor-btn-bg);
    border: 1px solid var(--editor-btn-border);
    color: var(--editor-btn-text);
    cursor: pointer;
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-size: 9px;
    padding: 4px 7px;
    border-radius: 2px;
    transition: background 0.1s, color 0.1s;
}

.editor-btn:hover {
    background: var(--slider-thumb);
    color: #ffffff;
}

#editor-textarea {
    flex: 1;
    background: var(--editor-bg);
    color: var(--editor-text);
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-size: 13px;
    line-height: 1.5;
    padding: 12px 14px;
    border: none;
    outline: none;
    resize: none;
    white-space: pre;
    overflow-x: auto;
    overflow-y: auto;
    tab-size: 2;
    caret-color: var(--color-system);
}

#editor-textarea::placeholder {
    color: var(--editor-text);
    opacity: 0.45;
}

#split-divider {
    height: 8px;
    background: var(--divider-bg);
    border-top: 1px solid var(--divider-border);
    border-bottom: 1px solid var(--divider-border);
    cursor: row-resize;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    touch-action: none;
    transition: background 0.15s;
}

#split-divider.divider-hidden {
    display: none !important;
}

#split-divider:hover, #split-divider:active {
    background: var(--color-system);
}

.divider-handle {
    width: 44px;
    height: 2px;
    background: var(--divider-handle);
    opacity: 0.8;
    border-radius: 2px;
}

/* Attached Files Tray */
#attached-files-tray {
    display: none;
    background: var(--tray-bg);
    border-top: 2px solid var(--tray-border);
    border-bottom: 1px solid var(--tray-border);
    padding: 10px 14px;
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-size: 10px;
    max-height: 130px;
    overflow-y: auto;
    flex-shrink: 0;
}

#attached-files-tray.tray-open {
    display: block;
}

.tray-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 9px;
    color: var(--color-system);
}

.attached-files-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.attached-file-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--tray-item-bg);
    border: 1px solid var(--tray-item-border);
    border-radius: 3px;
    color: var(--tray-item-text);
    cursor: pointer;
    user-select: none;
    transition: background 0.1s, border-color 0.1s, transform 0.05s;
    font-size: 9px;
}

.attached-file-item:hover {
    border-color: var(--color-system);
    background: var(--tray-item-hover-bg);
    transform: translateY(-1px);
}

.attached-file-item.copied {
    background: var(--color-info);
    color: #001a66;
    border-color: var(--color-info);
    font-weight: bold;
}

.tray-actions {
    display: flex;
    gap: 6px;
    align-items: center;
}

.tray-add-btn {
    background: var(--tray-item-bg);
    border: 1px solid var(--color-system);
    color: var(--color-system);
    font-size: 8px;
    padding: 3px 6px;
    cursor: pointer;
}

.tray-add-btn:hover {
    background: var(--color-system);
    color: #000000;
}

.file-remove-btn {
    background: transparent;
    border: none;
    color: var(--tray-item-text);
    opacity: 0.6;
    cursor: pointer;
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-size: 11px;
    line-height: 1;
    padding: 0 0 0 5px;
    margin-left: 4px;
    border-left: 1px solid rgba(255, 255, 255, 0.25);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.1s, color 0.1s;
}

.file-remove-btn:hover {
    opacity: 1;
    color: var(--color-error);
}

.attached-file-add-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: transparent;
    border: 1px dashed var(--color-system);
    border-radius: 3px;
    color: var(--color-system);
    cursor: pointer;
    user-select: none;
    font-family: var(--main-font, 'Press Start 2P', monospace);
    font-size: 9px;
    transition: background 0.1s, color 0.1s;
}

.attached-file-add-chip:hover {
    background: var(--color-system);
    color: #000000;
}

.attached-files-empty {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 0;
    color: var(--term-text);
    font-size: 9px;
    flex-wrap: wrap;
}

.drag-hint {
    opacity: 0.7;
    font-size: 8px;
}
    </style>

</head>
<body>

    <div id="app-split-container">
        <div id="editor-pane">
            <div id="editor-toolbar">
                <span class="editor-title">EDIT / SCRATCHPAD</span>

function outputNearBottom() {

function ansi256ToRGB(code) {
    if (code < 16) {
        const colors = [
            '#000000', '#cd0000', '#00cd00', '#cdcd00', '#0000ee', '#cd00cd', '#00cdcd', '#e5e5e5',
            '#7f7f7f', '#ff0000', '#00ff00', '#ffff00', '#5c5cff', '#ff00ff', '#00ffff', '#ffffff'
        ];
        return colors[code];
    } else if (code >= 16 && code <= 231) {
        const c = code - 16;
        const b = (c % 6) * 51;
        const g = (Math.floor(c / 6) % 6) * 51;
        const r = (Math.floor(c / 36) % 6) * 51;
        return `rgb(${r},${g},${b})`;
    } else if (code >= 232 && code <= 255) {
        const g = (code - 232) * 10 + 8;
        return `rgb(${g},${g},${g})`;
    }
    return '';
}

function printToTerminal(text, className = '') {
    const shouldFollow = outputNearBottom();
    const line = document.createElement('div');
    if (className) line.className = className;

    const parts = text.split(/\x1b\[([0-9;]+)m/);
    if (parts.length === 1) {
        line.textContent = text;
    } else {
        let fgColor = '';
        let bgColor = '';

        for (let i = 0; i < parts.length; i++) {
            if (i % 2 === 0) {
                if (parts[i]) {
                    const span = document.createElement('span');
                    if (fgColor) span.style.color = fgColor;
                    if (bgColor) span.style.backgroundColor = bgColor;
                    span.appendChild(document.createTextNode(parts[i]));
                    line.appendChild(span);
                }
            } else {
                const codes = parts[i].split(';');
                if (codes[0] === '38' && codes[1] === '2' && codes.length === 5) {
                    fgColor = `rgb(${codes[2]},${codes[3]},${codes[4]})`;
                } else if (codes[0] === '48' && codes[1] === '2' && codes.length === 5) {
                    bgColor = `rgb(${codes[2]},${codes[3]},${codes[4]})`;
                } else if (codes[0] === '38' && codes[1] === '5' && codes.length === 3) {
                    fgColor = ansi256ToRGB(Number(codes[2]));
                } else if (codes[0] === '48' && codes[1] === '5' && codes.length === 3) {
                    bgColor = ansi256ToRGB(Number(codes[2]));
                } else if (codes[0] === '0') {
                    fgColor = '';
                    bgColor = '';
                } else if (codes.length === 1 && codes[0] >= 30 && codes[0] <= 37) {
                    fgColor = ansi256ToRGB(codes[0] - 30);
                } else if (codes.length === 1 && codes[0] >= 40 && codes[0] <= 47) {
                    bgColor = ansi256ToRGB(codes[0] - 40);
                } else if (codes.length === 1 && codes[0] >= 90 && codes[0] <= 97) {
                    fgColor = ansi256ToRGB(codes[0] - 90 + 8);
                } else if (codes.length === 1 && codes[0] >= 100 && codes[0] <= 107) {
                    bgColor = ansi256ToRGB(codes[0] - 100 + 8);
                }
            }
        }
    }

    output.appendChild(line);
    if (shouldFollow) output.scrollTop = output.scrollHeight;
}

function parseVoiceGraph(text) {
    const graph = { version: 0, root: -1, nodes: [], edges: [] };
    const nodes = new Set();
    for (const line of text.trim().split(/\r?\n/)) {
        const field = line.trim().split(/\s+/);
        switch (field[0]) {
            case 'skred-voice-graph':
                graph.version = Number(field[1]);
                break;
            case 'root':
                graph.root = Number(field[1]);
                nodes.add(graph.root);
                break;
            case 'node':
                nodes.add(Number(field[1]));
                break;
            case 'edge': {
                const edge = {
                    from: Number(field[1]),
                    to: Number(field[2]),
                    type: Number(field[3]),
                    label: field[4]
                };
                graph.edges.push(edge);
                nodes.add(edge.from);
                nodes.add(edge.to);
                break;
            }
        }
    }
    if (graph.version !== 1 || graph.root < 0)
        throw new Error('unsupported voice graph response');
    graph.nodes = Array.from(nodes).sort((a, b) => a - b);
    return graph;
}

function voiceGraphLayout(graph) {
    const level = new Map([[graph.root, 0]]);
    for (let pass = 0; pass < graph.nodes.length; pass++) {
        let changed = false;
        for (const edge of graph.edges) {
            if (!level.has(edge.from) || level.has(edge.to)) continue;
            level.set(edge.to, level.get(edge.from) + 1);
            changed = true;
        }
        if (!changed) break;
    }
    const knownMax = Math.max(0, ...level.values());
    for (const voice of graph.nodes)
        if (!level.has(voice)) level.set(voice, knownMax + 1);

    const columns = new Map();
    for (const voice of graph.nodes) {
        const column = level.get(voice);
        if (!columns.has(column)) columns.set(column, []);
        columns.get(column).push(voice);
    }
    const maxLevel = Math.max(0, ...columns.keys());
    const maxRows = Math.max(1, ...Array.from(columns.values(), x => x.length));
    const width = Math.max(150, 80 + maxLevel * 110);
    const height = Math.max(90, 36 + maxRows * 56);
    const position = new Map();
    for (const [column, voices] of columns) {
        voices.forEach((voice, row) => position.set(voice, {
            x: maxLevel ? 40 + column * (width - 80) / maxLevel : width / 2,
            y: (row + 1) * height / (voices.length + 1)
        }));
    }
    return { width, height, position };
}

function svgElement(name, attributes = {}) {
    const element = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const [key, value] of Object.entries(attributes))
        element.setAttribute(key, value);
    return element;
}

let voiceGraphSequence = 0;

function appendVoiceGraph(graph) {
    const shouldFollow = outputNearBottom();
    const layout = voiceGraphLayout(graph);
    const container = document.createElement('div');
    container.className = 'voice-graph-output';
    const title = document.createElement('div');
    title.className = 'voice-graph-title';
    title.textContent = `voice graph v${graph.root} · ${graph.nodes.length} nodes · ${graph.edges.length} links`;
    container.appendChild(title);

    const svg = svgElement('svg', {
        viewBox: `0 0 ${layout.width} ${layout.height}`,
        width: layout.width,
        height: layout.height,
        role: 'img',
        'aria-label': `Dependency graph for voice ${graph.root}`
    });
    const markerId = `voice-graph-arrow-${++voiceGraphSequence}`;
    const defs = svgElement('defs');
    const marker = svgElement('marker', {
        id: markerId, markerWidth: 6, markerHeight: 6,
        refX: 5, refY: 3, orient: 'auto', markerUnits: 'strokeWidth'
    });
    marker.appendChild(svgElement('path', {
        d: 'M0,0 L6,3 L0,6 Z',
        class: 'voice-graph-arrow',
        fill: 'var(--graph-edge, #90b0ff)'
    }));
    defs.appendChild(marker);
    svg.appendChild(defs);

    const parallel = new Map();
    for (const edge of graph.edges) {
        const key = `${edge.from}:${edge.to}`;
        if (!parallel.has(key)) parallel.set(key, []);
        parallel.get(key).push(edge);
    }
    const edgeLabels = [];
    for (const edge of graph.edges) {
        const from = layout.position.get(edge.from);
        const to = layout.position.get(edge.to);
        if (!from || !to) continue;
        const siblings = parallel.get(`${edge.from}:${edge.to}`);
        const offset = (siblings.indexOf(edge) - (siblings.length - 1) / 2) * 14;
        const shortLabel = {
            'pitch': 'pitch', 'gate': 'gate', 'amp-mod': 'amp',
            'freq-mod': 'freq', 'pan-mod': 'pan',
            'phase-mod': 'phase', 'ring-mod': 'ring'
        };
        if (edge.from === edge.to) {
            const spread = 25 + siblings.indexOf(edge) * 8;
            const path = svgElement('path', {
                d: `M ${from.x - 10} ${from.y - 15} C ${from.x - spread} ${from.y - spread - 8}, ${from.x + spread} ${from.y - spread - 8}, ${from.x + 10} ${from.y - 15}`,
                class: 'voice-graph-edge',
                'marker-end': `url(#${markerId})`
            });
            const pathTitle = svgElement('title');
            pathTitle.textContent = `${edge.label}: v${edge.from} to itself`;
            path.appendChild(pathTitle);
            svg.appendChild(path);
            const label = svgElement('text', {
                x: from.x, y: from.y - spread - 10,
                class: 'voice-graph-edge-label'
            });
            label.textContent = shortLabel[edge.label] || edge.label;
            edgeLabels.push(label);
            continue;
        }
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const length = Math.hypot(dx, dy) || 1;
        const nx = -dy / length;
        const ny = dx / length;
        const startX = from.x + dx / length * 20;
        const startY = from.y + dy / length * 20;
        const endX = to.x - dx / length * 23;
        const endY = to.y - dy / length * 23;
        const controlX = (from.x + to.x) / 2 + nx * offset;
        const controlY = (from.y + to.y) / 2 + ny * offset;
        const path = svgElement('path', {
            d: `M ${startX} ${startY} Q ${controlX} ${controlY} ${endX} ${endY}`,
            class: 'voice-graph-edge',
            'marker-end': `url(#${markerId})`
        });
        const pathTitle = svgElement('title');
        pathTitle.textContent = `${edge.label}: v${edge.from} to v${edge.to}`;
        path.appendChild(pathTitle);
        svg.appendChild(path);
        const label = svgElement('text', {
            x: controlX, y: controlY - 3, class: 'voice-graph-edge-label'
        });
        label.textContent = shortLabel[edge.label] || edge.label;
        edgeLabels.push(label);
    }

    for (const voice of graph.nodes) {
        const point = layout.position.get(voice);
        const node = svgElement('g', {
            class: `voice-graph-node${voice === graph.root ? ' root' : ''}`,
            transform: `translate(${point.x} ${point.y})`
        });
        node.appendChild(svgElement('circle', { r: 18 }));
        const label = svgElement('text');
        label.textContent = `v${voice}`;
        node.appendChild(label);
        svg.appendChild(node);
    }
    for (const label of edgeLabels) svg.appendChild(label);
    container.appendChild(svg);
    output.appendChild(container);
    if (shouldFollow) output.scrollTop = output.scrollHeight;
}

function handleVoiceGraphText(text) {
    if (!text) {
        printToTerminal('Error: voice graph unavailable', 'error');
        return;
    }
    if (text.startsWith('#')) {
        printToTerminal(text, 'error');
        return;
    }
    appendVoiceGraph(parseVoiceGraph(text));
}

function showVoiceGraph(voice = 0, depth = 0) {
    if (!ensureBooted()) return;
    if (!Number.isInteger(voice) || voice < 0 || voice >= nvoices ||
        !Number.isInteger(depth) || depth < 0) {
        printToTerminal('Usage: -graph [voice [depth]]', 'error');
        return;
    }
    if ((useWorklet || workletReady || (!workletFailed && workletNode)) && workletNode) {
        workletNode.port.postMessage({ type: 'graph', voice, depth });
        return;
    }
    if (typeof Module === 'undefined' || typeof Module._skred_voice_graph !== 'function') {
        printToTerminal('Error: voice graph is not supported by this engine build', 'error');
        return;
    }
    try {
        const ptr = Module._skred_voice_graph(voice, 1, depth);
        if (!ptr) throw new Error('voice graph unavailable');
        const text = Module.UTF8ToString(ptr).trim();
        handleVoiceGraphText(text);
    } catch (error) {
        printToTerminal(`Error: ${error.message}`, 'error');
    }
}

function wasmHeapU8() {
    return typeof Module !== "undefined" ?
        (Module.HEAPU8 || globalThis.HEAPU8) : null;
}

let workletNode = null;
let workletAudioContext = null;
let useWorklet = false;
let workletReady = false;
let workletFailed = false;
let workletInitAttempted = false;

async function initAudioWorklet() {
    if (workletInitAttempted) return;
    workletInitAttempted = true;
    if (typeof window === "undefined" || !window.AudioContext || !window.AudioWorkletNode) {
        workletFailed = true;
        return;
    }
    if ('audioSession' in navigator) {
        try { navigator.audioSession.type = 'playback'; } catch (e) {}
    }
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        workletAudioContext = new AudioCtx({ latencyHint: "interactive" });
        workletAudioContext.addEventListener("statechange", () => {
            updateAudioStatus();
        });

        await workletAudioContext.audioWorklet.addModule("skred_worklet_processor.js?v=2.1.0");
        const resp = await fetch("skred_worklet_engine.wasm?v=2.1.0");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const wasmBinary = await resp.arrayBuffer();

        workletNode = new AudioWorkletNode(workletAudioContext, "skred-worklet-processor", {
            numberOfInputs: 0,
            numberOfOutputs: 1,
            outputChannelCount: [2],
            processorOptions: {
                wasmBinary: wasmBinary.slice ? wasmBinary.slice(0) : wasmBinary,
                sampleRate: workletAudioContext.sampleRate
            }
        });

        // Always also post the binary via message port as a robust fallback for browsers that
        // drop or do not clone ArrayBuffers in processorOptions (e.g. Firefox, iOS Safari)
        workletNode.port.postMessage({
            type: "init",
            wasmBinary: wasmBinary.slice ? wasmBinary.slice(0) : wasmBinary,
            sampleRate: workletAudioContext.sampleRate
        });

        workletNode.port.onmessage = (event) => {
            const data = event.data;
            if (!data) return;
            if (data.type === "ready") {
                workletReady = true;
                useWorklet = true;
                running = 1;
                updateAudioStatus();
                setSkredVersion(data.version || "2.1.0");
                workletNode.port.postMessage({ type: "features" });
            } else if (data.type === "log") {
                if (data.text) printToTerminal(data.text, 'info');
            } else if (data.type === "features") {
                if (data.text) printToTerminal(data.text);
            } else if (data.type === "graph") {
                handleVoiceGraphText(data.text);
            } else if (data.type === "error") {
                console.warn("[SkredWorklet] Runtime error, falling back to main-thread engine:", data.error);
                useWorklet = false;
                workletReady = false;
                workletFailed = true;
                workletNode = null;
                running = 0;
                ensureBooted();
            }
        };

        workletNode.connect(workletAudioContext.destination);
        updateAudioStatus();
    } catch (err) {
        console.warn("[SkredWorklet] Init failed, falling back to main-thread engine:", err);
        useWorklet = false;
        workletReady = false;
        workletFailed = true;
        workletNode = null;
    }
}
initAudioWorklet();

function updateAudioStatus() {
    if (!statusSpan) return;
    if (useWorklet && workletAudioContext) {
        const state = workletAudioContext.state;
        if (state === "running") {
            statusSpan.innerText = `AUDIO ON (worklet ${workletAudioContext.sampleRate}Hz)`;
            statusSpan.title = "Audio engine is running";
            statusSpan.style.cursor = "default";
        } else if (state === "suspended" || state === "interrupted") {
            statusSpan.innerText = `AUDIO PAUSED (tap to play)`;
            statusSpan.title = "Audio is paused - tap here or touch screen to activate";
            statusSpan.style.cursor = "pointer";
        } else {
            statusSpan.innerText = `AUDIO OFF`;
            statusSpan.style.cursor = "default";
        }
    } else if (running) {
        statusSpan.innerText = `AUDIO ON ${nvoices} ${bufsize}`;
        statusSpan.style.cursor = "default";
    } else {
        statusSpan.innerText = `AUDIO OFF`;
        statusSpan.style.cursor = "default";
    }
}

function unlockAudio() {
    if ('audioSession' in navigator) {
        try { navigator.audioSession.type = 'playback'; } catch (e) {}
    }
    if (workletAudioContext) {
        if (workletAudioContext.state === "suspended" || workletAudioContext.state === "interrupted") {
            workletAudioContext.resume().then(() => {
                updateAudioStatus();
            }).catch(() => {});
            try {
                const buf = workletAudioContext.createBuffer(1, 1, workletAudioContext.sampleRate);
                const src = workletAudioContext.createBufferSource();
                src.buffer = buf;
                src.connect(workletAudioContext.destination);
                src.start(0);
            } catch (e) {}
        }
    }
}
window.addEventListener("pointerdown", unlockAudio, { passive: true });
window.addEventListener("pointerup", unlockAudio, { passive: true });
window.addEventListener("touchstart", unlockAudio, { passive: true });
window.addEventListener("touchend", unlockAudio, { passive: true });
window.addEventListener("click", unlockAudio, { passive: true });
window.addEventListener("keydown", unlockAudio, { passive: true });
document.addEventListener("visibilitychange", () => {

});
statusSpan.addEventListener("click", (e) => {

cmdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        const rawCmd = cmdInput.value.trim();
        if (!rawCmd) return;
        if (commandHistory[commandHistory.length - 1] !== rawCmd) commandHistory.push(rawCmd);
        historyIndex = -1;
        printToTerminal(rawCmd, 'dim');
        processCommand(rawCmd);
        cmdInput.value = '';
    } 
    else if (e.key === 'ArrowUp') {
        if (commandHistory.length > 0) {
            if (historyIndex === -1) historyIndex = commandHistory.length - 1;
            else if (historyIndex > 0) historyIndex--;
            cmdInput.value = commandHistory[historyIndex];
            setTimeout(() => cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length), 0);
        }
        e.preventDefault();
    } 
    else if (e.key === 'ArrowDown') {
        if (historyIndex !== -1) {
            if (historyIndex < commandHistory.length - 1) {
                historyIndex++;
                cmdInput.value = commandHistory[historyIndex];
            } else {
                historyIndex = -1;
                cmdInput.value = '';
            }
        }
        e.preventDefault();
    }
    else if (e.key === 'Tab') {
        e.preventDefault();
        const cursor = cmdInput.selectionStart;
        const text = cmdInput.value;
        const textBefore = text.slice(0, cursor);
        const textAfter = text.slice(cursor);

        const match = textBefore.match(/([^\s]+)$/);
        if (!match) {
            printToTerminal("Type a command prefix (e.g. pw, f, w, v, -restart) and press Tab", "dim");
            return;
        }

        const prefix = match[1];
        const tokenStart = match.index;

        const matches = typeof skodeComplete === "function" ? skodeComplete(prefix) : [];
        if (matches.length === 0) {
            return;
        }

        if (matches.length === 1) {
            const completed = matches[0] + " ";
            cmdInput.value = textBefore.slice(0, tokenStart) + completed + textAfter;
            const newCursor = tokenStart + completed.length;
            cmdInput.setSelectionRange(newCursor, newCursor);
            return;
        }

        const common = typeof skodeCommonPrefix === "function" ? skodeCommonPrefix(matches) : prefix;
        if (common.length > prefix.length) {
            cmdInput.value = textBefore.slice(0, tokenStart) + common + textAfter;
            const newCursor = tokenStart + common.length;
            cmdInput.setSelectionRange(newCursor, newCursor);
        } else {
            if (matches.length <= 12) {
                printToTerminal(`Matching commands (${matches.length}):`, 'dim');
                for (let i = 0; i < matches.length; i++) {
                    const info = typeof skodeGetInfo === "function" ? skodeGetInfo(matches[i]) : null;
                    const altStr = (info && info.alt) ? `[${info.alt}]` : "";
                    const descStr = (info && info.summary) ? ` - ${info.summary}` : "";
                    const padCmd = matches[i].padEnd(10, ' ');
                    const padAlt = altStr ? altStr.padEnd(24, ' ') : "".padEnd(24, ' ');
                    printToTerminal(`  ${padCmd} ${padAlt}${descStr}`, 'system');
                }
            } else {
                printToTerminal(`Matching commands (${matches.length}):`, 'dim');
                let line = " ";
                for (let i = 0; i < matches.length; i++) {
                    line += " " + matches[i].padEnd(12, ' ');
                    if ((i + 1) % 4 === 0 || i === matches.length - 1) {
                        printToTerminal(line, 'system');
                        line = " ";
                    }
                }
            }
        }
    }
});
cmdInput.addEventListener('focus', unlockAudio);

function ensureBooted() {
    unlockAudio();
    if (running) {
        return true;
    }
    if (!workletFailed && (workletReady || workletNode) && workletAudioContext) {
        useWorklet = true;
        running = 1;
        updateAudioStatus();
        return true;
    }
    if (!workletFailed) {
        return false;
    }
    try {
        const result = Module._skred_start(bufsize, nvoices, 0); 
        statusSpan.innerText = `AUDIO ON ${nvoices} ${bufsize}`;
        const ptr = Module._skred_features();
        printToTerminal(`${Module.UTF8ToString(ptr)}`);
        Module.ccall('skred_command', null, ['string'], ["log 1"]);
        centerSpan.innerText = "log 1";
        running = 1;
        return true;
    } catch(e) {
        printToTerminal(`Error: Could not boot.`, 'error');
        return false;
    }
}

let lastRecordedFile = null;

function saveRecordedFile(requestedName) {
    const fs = window.FS || (typeof Module !== 'undefined' ? Module.FS : null);
    if (!fs) {
        const err = "Error: FS object not found on window or Module.";
        console.error(err);
        printToTerminal(err, "error");
        return false;
    }

    let targetName = requestedName ? requestedName.trim() : null;
    if (targetName && targetName.startsWith('[') && targetName.endsWith(']')) {
        targetName = targetName.slice(1, -1).trim();
    }
    if (!targetName) {
        targetName = lastRecordedFile;
    }

    function findFileInFS(name) {
        if (!name) return null;
        const candidates = [
            name,
            '/' + name,
            name.startsWith('/') ? name.slice(1) : '/' + name
        ];
        for (const p of candidates) {
            try {
                const stat = fs.stat(p);
                if (stat && !fs.isDir(stat.mode)) {
                    return p;
                }
            } catch (e) {}
        }
        return null;
    }

    let virtualPath = findFileInFS(targetName);

    // If not found by specific name, scan '/' for any .wav files
    if (!virtualPath) {
        try {
            const files = fs.readdir('/');
            const wavFiles = [];
            for (const f of files) {
                if (f === '.' || f === '..') continue;
                try {
                    const p = '/' + f;
                    const stat = fs.stat(p);
                    if (stat && !fs.isDir(stat.mode) && f.toLowerCase().endsWith('.wav')) {
                        wavFiles.push({ path: p, name: f, mtime: stat.mtime });
                    }
                } catch (e) {}
            }
            if (wavFiles.length > 0) {
                wavFiles.sort((a, b) => b.mtime - a.mtime);
                virtualPath = wavFiles[0].path;
                targetName = wavFiles[0].name;
            }
        } catch (e) {}
    }

    if (!virtualPath) {
        const msg = "No recorded file found in virtual filesystem. Record first using [filename.wav] /rg then /rs";
        console.warn(msg);
        printToTerminal(msg, "error");
        return false;
    }

    let saveAsName = targetName ? targetName.split('/').pop() : virtualPath.split('/').pop();
    if (!saveAsName.toLowerCase().endsWith('.wav')) {
        saveAsName += '.wav';
    }

    try {
        const fileData = fs.readFile(virtualPath, { encoding: 'binary' });
        if (!fileData || fileData.length === 0) {
            printToTerminal(`Warning: ${virtualPath} is empty (0 bytes). Did you run /rs to finish recording?`, "error");
        }
        const blob = new Blob([fileData], { type: 'audio/wav' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = saveAsName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        const successMsg = `Downloaded ${virtualPath} as ${saveAsName} (${fileData.length} bytes)`;
        console.log(successMsg);
        printToTerminal(successMsg, "system");
        return true;
    } catch (err) {
        const errMsg = `Failed to read ${virtualPath} from virtual filesystem: ${err.message || err}`;
        console.error(errMsg, err);
        printToTerminal(errMsg, "error");
        return false;
    }
}

function processCommand(cmd) {
    const trimmed = cmd.trim();
    if (!trimmed) return;
    const arg = trimmed.split(/\s+/);
    const action = arg[0].toLowerCase();

    const shareMatch = trimmed.match(/\[([^\]]+)\](?:\s*([a-zA-Z0-9]+))?\s*\/share/);
    if (shareMatch) {
        shareSnippetViaClipboard(shareMatch[1].trim(), shareMatch[2]);
        return;
    }
    const loadMatch = trimmed.match(/\[([^\]]+)\]\s*\/load/);
    if (loadMatch) {
        loadSnippetFromClipboard(loadMatch[1].trim());
        return;
    }
    const numLoadMatch = trimmed.match(/^([a-zA-Z0-9]{3,8})\s*\/load/);
    if (numLoadMatch) {
        loadSnippetFromClipboard(numLoadMatch[1].trim());
        return;
    }

    const rgMatch = cmd.match(/\[([^\]]+)\]\s*\/rg/);
    if (rgMatch) {
        lastRecordedFile = rgMatch[1].trim();
    }

    switch(action) {
        case '-restart':
        case '.restart':
            if (running) {
                Module._skred_stop();
                running = 0;
            }
            if (arg.length > 1) {
                var n = Number(arg[1]);
                if (n > 0 && n <= 256) nvoices = n;
                if (arg.length > 2) {
                    n = Number(arg[2]);
                    if (n >= 128) bufsize = n;
                }
            }
            ensureBooted();
            break;

        case '-stop':
        case '.stop':
            if (!ensureBooted()) return;
            if (useWorklet && workletAudioContext) {
                workletAudioContext.suspend();
            } else {
                Module._skred_stop();
            }
            printToTerminal("System: Engine stopped.", "system");
            statusSpan.innerText = "AUDIO OFF";
            running = 0;
            break;
        case '-':
        case '.':
        case '-font':
        case '.font':
            const currentFont = (document.documentElement.style.getPropertyValue('--main-font') === 'monospace') ? 'mono' : '2p';
            let targetFont = (currentFont === 'mono') ? '2p' : 'mono';
            if (arg.length > 1) {
                const requested = arg[1].toLowerCase();
                if (requested === 'mono' || requested === 'monospace') targetFont = 'mono';
                else if (requested === '2p' || requested === 'retro' || requested === 'press') targetFont = '2p';
            }
            applyFont(targetFont);
            printToTerminal("Font: " + (targetFont === 'mono' ? "monospace" : "Press Start 2P"), 'system');
            break;
        case '-dark':
        case '.dark':
        case 'dark':
            applyTheme('dark');
            printToTerminal("Theme: dark (Atari)", 'system');
            break;
        case '-light':
        case '.light':
        case 'light':
        case '-erasmus':
        case '.erasmus':
        case 'erasmus':
            applyTheme('light');
            printToTerminal("Theme: light (Erasmus)", 'system');
            break;
        case '-theme':
        case '.theme':
        case 'theme':
            if (arg.length > 1 && (arg[1].toLowerCase() === 'light' || arg[1].toLowerCase() === 'erasmus')) {
                applyTheme('light');
                printToTerminal("Theme: light (Erasmus)", 'system');
            } else if (arg.length > 1 && (arg[1].toLowerCase() === 'dark' || arg[1].toLowerCase() === 'atari')) {
                applyTheme('dark');
                printToTerminal("Theme: dark (Atari)", 'system');
            } else {
                const cur = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
                const nxt = cur === 'light' ? 'dark' : 'light';
                applyTheme(nxt);
                printToTerminal("Theme: " + (nxt === 'light' ? "light (Erasmus)" : "dark (Atari)"), 'system');
            }
            break;
        case '-help':
        case '.help': usage(); break;
        case '-add':
        case '.add':
            if (!ensureBooted()) return;
            addFileViaDialog();
            break;
        case '-rm':
        case '.rm':
        case '-remove':
        case '.remove':
        case '-del':
        case '.del': {
            if (arg.length > 1) {
                const target = arg[1].replace(/^[\[{]/, '').replace(/[\]}]$/, '').trim();
                removeAttachedFile(target);
            } else {
                printToTerminal("Usage: -rm <filename> or -rm [filename]", "error");
            }
            break;
        }
        case 'paste':
        case '-paste':
        case '.paste':
            pasteToVirtualFile(arg.length > 1 ? arg[1] : 'paste.sk');
            break;
        case 'share':
        case '/share':
            if (arg.length > 1) {
                if (arg.length === 2 && /^[a-z0-9]{3,8}$/i.test(arg[1])) {
                    shareSnippetViaClipboard(commandHistory[commandHistory.length - 1] || "", arg[1]);
                } else {
                    shareSnippetViaClipboard(arg.slice(1).join(' '));
                }
            } else {
                shareSnippetViaClipboard(commandHistory[commandHistory.length - 1] || "");
            }
            break;
        case 'load':
        case '/load':
            if (arg.length > 1) {
                loadSnippetFromClipboard(arg[1]);
            } else {
                printToTerminal("Usage: /load <code>", "info");
            }
            break;
        case '-load':
        case '.load':
            if (!ensureBooted()) return;
            addWavViaDialog();
            break;
        case '-save':
        case '.save':
            saveRecordedFile(arg.length > 1 ? arg.slice(1).join(' ') : null);
            break;
        case '-zip':
        case '.zip':
            mountZipViaDialog();
            break;
        case '-unzip':
        case '.unzip':
            unmountZipBundle();
            break;
        case 'clear':
        case '-clear':
        case '.clear':
            output.innerHTML = '<div class="terminal-spacer"></div>';
            output.scrollTop = output.scrollHeight;
            break;
        case 'graph':
        case '-graph':
        case '.graph': {
            let voice = 0;
            let depth = 0;
            if (arg.length > 1) {
                const vStr = arg[1].replace(/^[vV]/, '');
                voice = Number(vStr);
            }
            if (arg.length > 2) {
                depth = Number(arg[2]);
            }
            showVoiceGraph(voice, depth);
            break;
        }
        case '-logo':
        case '.logo':
            printLogoToTerminal();
            break;
        case '-edit':
        case '.edit':
        case '-split':
        case '.split':
            toggleEditorSplit();
            break;
        case '-files':
        case '.files':
            toggleFilesTray();
            break;
        case '-reset':
        case '.reset':
        case 'reset':
            if (ensureBooted()) {
                sendSkredCommand('reset');
            }
            printToTerminal("System: Reset complete (editor preserved).", "system");
            break;
        case '-learn':
        case '.learn':
          window.open('https://octetta.github.io/skred-web/learn.html', "_blank");
          break;
        case '-ksynth':
        case '.ksynth':
          window.open('https://octetta.github.io/k-synth', "_blank");
          break;

        default:
            if (ensureBooted()) {
                sendSkredCommand(cmd);
            }
            break;
    }
}

function sendSkredCommand(cmd) {
    if (!ensureBooted()) return false;
    const rgMatch = cmd.match(/\[([^\]]+)\]\s*\/rg/);
    if (rgMatch) {
        lastRecordedFile = rgMatch[1].trim();
    }
    if ((useWorklet || workletReady || (!workletFailed && workletNode)) && workletNode) {
        workletNode.port.postMessage({ type: 'cmd', text: cmd });
        return true;
    }
    Module.ccall('skred_command', null, ['string'], [cmd]);
    const log = skredLogString();
    if (log !== "") {
        printToTerminal(log, 'info');
    }
    return true;
}

function formatSliderValue(value, step) {
    const n = Number(value);
    const s = Number(step);
    if (!Number.isFinite(n)) return "0";
    if (!Number.isFinite(s) || s <= 0) return `${n}`;
    const text = `${s}`;
    const dot = text.indexOf('.');
    const places = dot >= 0 ? Math.min(8, text.length - dot - 1) : 0;
    const formatted = n.toFixed(places);
    return formatted.includes('.') ? formatted.replace(/\.?0+$/, '') : formatted;
}

function sliderParts(row) {
    return {
        cmd: row.querySelector('.slider-cmd'),
        min: row.querySelector('.slider-min'),
        max: row.querySelector('.slider-max'),
        step: row.querySelector('.slider-step'),
        slider: row.querySelector('.cmd-slider')
    };
}

function updateCommandSliderRange(row) {
    const parts = sliderParts(row);
    let min = Number(parts.min.value);
    let max = Number(parts.max.value);
    let step = Number(parts.step.value);
    if (!Number.isFinite(min)) min = 0;
    if (!Number.isFinite(max)) max = 1;
    if (max < min) {
        const tmp = max;
        max = min;
        min = tmp;
    }
    if (!Number.isFinite(step) || step <= 0) step = 1;
    parts.slider.min = min;
    parts.slider.max = max;
    parts.slider.step = step;
    if (Number(parts.slider.value) < min) parts.slider.value = min;
    if (Number(parts.slider.value) > max) parts.slider.value = max;
}

function sendSliderCommand(row) {
    const parts = sliderParts(row);
    updateCommandSliderRange(row);
    const value = formatSliderValue(parts.slider.value, parts.slider.step);
    const template = parts.cmd.value.trim();
    if (!template) return;
    const cmd = template.includes('{}') ? template.replaceAll('{}', value) : `${template}${value}`;
    if (sendSkredCommand(cmd)) centerSpan.innerText = cmd;
}

const sliderPending = new Set();
function onSliderInput(row) {
    unlockAudio();
    if (sliderPending.has(row)) return;
    sliderPending.add(row);
    requestAnimationFrame(() => {
        sliderPending.delete(row);
        sendSliderCommand(row);
    });
}

sliderRows.forEach(row => {
    const parts = sliderParts(row);
    parts.min.addEventListener('change', () => updateCommandSliderRange(row));
    parts.max.addEventListener('change', () => updateCommandSliderRange(row));

function writeVirtualFile(name, bytes) {
    const fs = window.FS || (typeof Module !== "undefined" ? Module.FS : null);
    if (fs && fs.writeFile) {
        try { fs.writeFile(name, bytes); } catch (e) {}
    }
    if ((useWorklet || workletReady || (!workletFailed && workletNode)) && workletNode) {
        workletNode.port.postMessage({ type: "file", path: name, data: bytes });
    }
    if (typeof recordAttachedFile === "function") {
        const type = name.endsWith('.wav') || name.endsWith('.mp3') ? 'wav' : (name.endsWith('.zip') ? 'zip' : 'file');
        recordAttachedFile(name, bytes ? bytes.length : 0, type);
    }
}

async function pasteToVirtualFile(targetName = 'paste.sk') {
    if (!ensureBooted()) return;

    let text = null;
    if (navigator.clipboard && navigator.clipboard.readText) {
        try {
            text = await navigator.clipboard.readText();
        } catch (err) {
            console.warn("Clipboard readText failed, falling back to prompt:", err);
        }
    }

    if (text === null || text === undefined) {
        text = window.prompt(`Paste Skode code for ${targetName}:`);
    }

    if (text === null) {
        return;
    }

    if (!text || text.trim().length === 0) {
        printToTerminal("Clipboard / input is empty.", "error");
        return;
    }

    try {
        const bytes = new TextEncoder().encode(text);
        writeVirtualFile(targetName, bytes);
        const lineCount = text.split(/\r?\n/).length;
        printToTerminal(`Pasted ${bytes.length} bytes (${lineCount} lines) into [${targetName}] (run with [${targetName}] /ls)`, "system");
        if (typeof centerSpan !== "undefined" && centerSpan) {
            centerSpan.innerText = `[${targetName}]`;
        }
    } catch (err) {
        console.error(`Failed to write ${targetName}:`, err);
        printToTerminal(`Error writing ${targetName}: ${err.message || err}`, "error");
    }
}

function generateClipCode() {
    const chars = "abcdefghjkmnpqrstuvwxyz23456789";
    let code = "";
    for (let i = 0; i < 4; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
}

async function shareSnippetViaClipboard(codeText, requestedCode) {
    const text = (codeText || "").trim();
    if (!text) {
        printToTerminal("Error: nothing to share. Usage: [code] /share or /share <code>", "error");
        return null;
    }
    const code = (requestedCode ? String(requestedCode).trim() : "") || generateClipCode();
    try {
        const resp = await fetch(`https://ntfy.sh/sk-${encodeURIComponent(code)}`, {
            method: 'POST',
            body: text
        });
        if (!resp.ok) {
            printToTerminal(`Warning: clipboard server returned ${resp.status}`, "error");
        }
    } catch (e) {
        console.warn("Share to ntfy failed:", e);
    }

    try {
        if (typeof Module !== "undefined" && Module.ccall) {
            Module.ccall('skred_command', null, ['string'], [`[${text}] ${code} /share`]);
        }
    } catch (e) {}

    const shareUrl = `${window.location.origin}${window.location.pathname}?c=${code}`;
    printToTerminal("====================================================", "system");
    printToTerminal(`Published to public clipboard! Code: ${code}`, "system");
    printToTerminal(`Load in CLI/GUI with: [${code}] /load`, "system");
    printToTerminal(`Share URL: ${shareUrl}`, "system");
    printToTerminal("====================================================", "system");

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
            printToTerminal(`(Copied share URL to system clipboard)`, "info");
        }).catch(() => {});
    }
    return code;
}

async function loadSnippetFromClipboard(code) {
    const c = (code || "").trim();
    if (!c) {
        printToTerminal("Error: code missing. Usage: /load <code> or [<code>] /load", "error");
        return null;
    }
    printToTerminal(`Fetching clipboard [${c}]...`, "system");
    try {
        const resp = await fetch(`https://ntfy.sh/sk-${encodeURIComponent(c)}/raw?poll=1`);
        if (!resp.ok) {
            printToTerminal(`Clipboard [${c}] not found or expired (${resp.status})`, "error");
            return null;
        }
        let text = await resp.text();
        text = text.replace(/[\r\n\s]+$/, '');
        if (!text || text.startsWith("{\"code\":") || text.startsWith("<!DOCTYPE") || text.startsWith("<html")) {
            printToTerminal(`Clipboard [${c}] is empty or unavailable.`, "error");
            return null;
        }
        printToTerminal(`Loaded from clipboard [${c}]: ${text}`, "info");
        ensureBooted();
        sendSkredCommand(text);
        return text;
    } catch (err) {
        printToTerminal(`Error loading clipboard [${c}]: ${err.message || err}`, "error");
        return null;
    }
}

function checkAutoLoadSnippet() {
    const urlParams = new URLSearchParams(window.location.search);
    let code = urlParams.get('c');
    if (!code && window.location.hash) {
        const hMatch = window.location.hash.match(/[#&]c=([a-zA-Z0-9]+)/);
        if (hMatch) code = hMatch[1];
    }
    if (code) {
        setTimeout(() => {
            loadSnippetFromClipboard(code);
        }, 400);
    }
}

// ==========================================
// Attached Files Tray & Management
// ==========================================
const attachedFiles = [];

function formatFileSize(bytes) {
    if (!Number.isFinite(bytes) || bytes <= 0) return "0 B";
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fallbackCopyText(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
}

function copyFileNameToClipboard(name, elem) {
    const textToCopy = `[${name}]`;
    const finish = () => {
        if (elem) {
            elem.classList.add('copied');
            const origHtml = elem.innerHTML;
            elem.innerHTML = `✓ ${escapeHtml(textToCopy)} Copied!`;
            setTimeout(() => {
                elem.classList.remove('copied');
                elem.innerHTML = origHtml;
            }, 1200);
        }
        printToTerminal(`Copied ${textToCopy} to clipboard`, 'system');
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(finish).catch(() => {
            fallbackCopyText(textToCopy);
            finish();
        });
    } else {
        fallbackCopyText(textToCopy);
        finish();
    }
}

function recordAttachedFile(name, size, type = 'file') {
    if (!name) return;
    const existing = attachedFiles.find(f => f.name === name);
    if (existing) {
        existing.size = size;
        existing.type = type;
        existing.time = Date.now();
    } else {
        attachedFiles.push({ name, size, type, time: Date.now() });
    }
    updateAttachedFilesUI();
}

function removeVirtualFile(name) {
    if (!name) return;
    const fs = window.FS || (typeof Module !== "undefined" ? Module.FS : null);
    if (fs && fs.unlink) {
        try { fs.unlink(name); } catch (e) {}
        try { fs.unlink("/" + name); } catch (e) {}
    }
    if ((useWorklet || workletReady || (!workletFailed && workletNode)) && workletNode) {
        workletNode.port.postMessage({ type: "unlink", path: name });
    }
}

function removeAttachedFile(name) {
    if (!name) return;
    const cleanName = name.trim();
    const idx = attachedFiles.findIndex(f => f.name === cleanName);
    if (idx !== -1) {
        attachedFiles.splice(idx, 1);
        removeVirtualFile(cleanName);
        updateAttachedFilesUI();
        printToTerminal(`Removed [${cleanName}] from virtual filesystem`, 'system');
        if (typeof centerSpan !== "undefined" && centerSpan && centerSpan.innerText.includes(cleanName)) {
            centerSpan.innerText = "";
        }
    } else {
        printToTerminal(`File not found: [${cleanName}]`, 'error');
    }
}

function updateAttachedFilesUI() {
    const filesToggle = document.getElementById('files-toggle');
    const tray = document.getElementById('attached-files-tray');
    const list = document.getElementById('attached-files-list');
    if (!filesToggle || !tray || !list) return;

    filesToggle.style.display = 'inline-flex';
    filesToggle.textContent = `[FILES:${attachedFiles.length}]`;
    filesToggle.title = `${attachedFiles.length} attached file(s) - click to show/hide`;

    list.innerHTML = '';
    if (attachedFiles.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'attached-files-empty';
        emptyDiv.innerHTML = `
            <span>No attached files yet.</span>
            <button class="editor-btn tray-add-btn" id="empty-add-btn">+ CHOOSE FILE</button>
            <span class="drag-hint">or drag & drop files here</span>
        `;
        list.appendChild(emptyDiv);
        const emptyBtn = emptyDiv.querySelector('#empty-add-btn');
        if (emptyBtn) {
            emptyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                addFileViaDialog();
            });
        }
        return;
    }

    attachedFiles.forEach(file => {
        const item = document.createElement('div');
        item.className = 'attached-file-item';
        item.title = `Click to copy [${file.name}] to clipboard`;
        const icon = file.type === 'wav' ? '🔊' : (file.type === 'zip' ? '📦' : '📄');
        item.innerHTML = `
            <span class="file-chip-icon">${icon}</span>
            <span class="file-chip-name">[${escapeHtml(file.name)}]</span>
            <span class="file-chip-size">(${formatFileSize(file.size)})</span>
            <button class="file-remove-btn" title="Remove ${escapeHtml(file.name)}">&times;</button>
        `;

        item.addEventListener('click', (e) => {
            e.stopPropagation();
            copyFileNameToClipboard(file.name, item);
        });

        const removeBtn = item.querySelector('.file-remove-btn');
        if (removeBtn) {
            removeBtn.addEventListener('click', (e) => {
                e.stopPropagation();

            });

        list.appendChild(item);
    });

    const addChip = document.createElement('button');
    addChip.className = 'attached-file-add-chip';
    addChip.title = 'Add another file to virtual filesystem';
    addChip.textContent = '+ ADD FILE';
    addChip.addEventListener('click', (e) => {
        e.stopPropagation();
        addFileViaDialog();
    });
    list.appendChild(addChip);

function toggleFilesTray(forceState) {

}

// ==========================================
// Editor Split Screen & Persistent Scratchpad
// ==========================================
const editorPane = document.getElementById('editor-pane');
const splitDivider = document.getElementById('split-divider');
const editorTextarea = document.getElementById('editor-textarea');
const splitToggle = document.getElementById('split-toggle');
const editorRunBtn = document.getElementById('editor-run-btn');
const editorCopyBtn = document.getElementById('editor-copy-btn');
const editorClearBtn = document.getElementById('editor-clear-btn');
const editorCloseBtn = document.getElementById('editor-close-btn');

function initEditorSplit() {
    // 1. Restore persistent content
    const savedContent = localStorage.getItem('skred_editor_content');
    if (savedContent !== null && editorTextarea) {
        editorTextarea.value = savedContent;
    }

    // 2. Restore persistent height
    const savedHeight = parseInt(localStorage.getItem('skred_editor_height'), 10);
    if (savedHeight && savedHeight >= 60 && editorPane) {
        editorPane.style.height = `${savedHeight}px`;
    }

    // 3. Restore open/close state
    // Default open on desktop unless user explicitly closed it
    const savedOpen = localStorage.getItem('skred_editor_open');
    const shouldOpen = savedOpen === '1' || (savedOpen === null && window.innerWidth >= 600);
    toggleEditorSplit(shouldOpen);

    // Save content on edit
    if (editorTextarea) {
        editorTextarea.addEventListener('input', () => {
            localStorage.setItem('skred_editor_content', editorTextarea.value);
        });

        // Tab key inserts 2 spaces; Ctrl/Cmd+Enter executes
        editorTextarea.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                executeEditorCode();
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const start = editorTextarea.selectionStart;
                const end = editorTextarea.selectionEnd;
                const val = editorTextarea.value;
                editorTextarea.value = val.substring(0, start) + "  " + val.substring(end);
                editorTextarea.selectionStart = editorTextarea.selectionEnd = start + 2;
                localStorage.setItem('skred_editor_content', editorTextarea.value);
            }
        });
    }

    // Toolbar buttons
    if (editorRunBtn) {
        editorRunBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            executeEditorCode();
        });
    }

    if (editorCopyBtn) {
        editorCopyBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const text = editorTextarea.value;
            if (!text) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            } else {
                fallbackCopyText(text);
            }
            editorCopyBtn.textContent = 'COPIED!';
            setTimeout(() => { editorCopyBtn.textContent = 'COPY'; }, 1000);
            printToTerminal("Copied scratchpad contents to clipboard", "system");
        });
    }

    if (editorClearBtn) {
        editorClearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!editorTextarea.value.trim() || confirm("Clear editor scratchpad?")) {
                editorTextarea.value = "";
                localStorage.setItem('skred_editor_content', "");
                editorTextarea.focus();
            }
        });
    }

    if (editorCloseBtn) {
        editorCloseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleEditorSplit(false);
        });
    }

    if (splitToggle) {
        splitToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleEditorSplit();
        });
    }

    // Movable Divider Dragging
    if (splitDivider) {
        let isDragging = false;
        let startY = 0;
        let startHeight = 0;

        splitDivider.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startY = e.clientY;
            startHeight = editorPane.offsetHeight;
            splitDivider.setPointerCapture(e.pointerId);
            document.body.style.cursor = 'row-resize';
            document.body.style.userSelect = 'none';
        });

        splitDivider.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaY = e.clientY - startY;
            const minHeight = 60;
            const maxHeight = Math.max(100, window.innerHeight - 150);
            const targetHeight = Math.min(Math.max(startHeight + deltaY, minHeight), maxHeight);
            editorPane.style.height = `${targetHeight}px`;
        });

        const endDrag = (e) => {
            if (!isDragging) return;
            isDragging = false;
            try { splitDivider.releasePointerCapture(e.pointerId); } catch (err) {}
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            localStorage.setItem('skred_editor_height', editorPane.offsetHeight);
        };

        splitDivider.addEventListener('pointerup', endDrag);
        splitDivider.addEventListener('pointercancel', endDrag);

        splitDivider.addEventListener('dblclick', () => {
            editorPane.style.height = '220px';
            localStorage.setItem('skred_editor_height', '220');
        });
    }

    // Global keyboard shortcuts (Ctrl+E or Cmd+E to toggle focus, Escape to return to cmdInput)
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && (e.key === 'e' || e.key === 'E')) {
            e.preventDefault();
            if (document.activeElement === editorTextarea) {
                cmdInput.focus();
            } else {
                if (editorPane.classList.contains('editor-hidden')) {
                    toggleEditorSplit(true);
                }
                editorTextarea.focus();
            }
        } else if (e.key === 'Escape' && document.activeElement === editorTextarea) {
            e.preventDefault();
            cmdInput.focus();
        }
    });
}

function toggleEditorSplit(forceOpen) {
    if (!editorPane || !splitDivider) return;
    const isCurrentlyHidden = editorPane.classList.contains('editor-hidden');
    const open = typeof forceOpen === 'boolean' ? forceOpen : isCurrentlyHidden;

    if (open) {
        editorPane.classList.remove('editor-hidden');
        splitDivider.classList.remove('divider-hidden');
        if (splitToggle) splitToggle.classList.add('active');
        localStorage.setItem('skred_editor_open', '1');
    } else {
        editorPane.classList.add('editor-hidden');
        splitDivider.classList.add('divider-hidden');
        if (splitToggle) splitToggle.classList.remove('active');
        localStorage.setItem('skred_editor_open', '0');
        cmdInput.focus();
    }
}

function executeEditorCode() {
    if (!ensureBooted()) return;
    let text = "";
    if (editorTextarea.selectionStart !== editorTextarea.selectionEnd) {
        text = editorTextarea.value.substring(editorTextarea.selectionStart, editorTextarea.selectionEnd);
    } else {
        // Run current line if cursor on non-empty line, else entire text
        const cursor = editorTextarea.selectionStart;
        const val = editorTextarea.value;
        const lineStart = val.lastIndexOf('\n', cursor - 1) + 1;
        let lineEnd = val.indexOf('\n', cursor);
        if (lineEnd === -1) lineEnd = val.length;
        const currentLine = val.substring(lineStart, lineEnd).trim();
        if (currentLine && !currentLine.startsWith('#') && !currentLine.startsWith('//')) {
            text = currentLine;
        } else {
            text = val;
        }
    }

    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0 && !l.startsWith('#') && !l.startsWith('//'));
    if (!lines.length) return;

    lines.forEach(line => {
        printToTerminal(line, 'dim');
        processCommand(line);
    });
}

initEditorSplit();
printLogoToTerminal();
</script>
