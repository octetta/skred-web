name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - sk3_release
      - sk3_update
      - pulp_release
      - pulp_update

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch WASM release
        run: |
          ./fetch-wasm.sh
          if [ ! -f skred_api.wasm ]; then
             echo "Failed to extract wasm file"
             exit 1
          fi
          SHORT_HASH=$(git rev-parse --short HEAD)
          VERSION=$(cat WASM_VERSION.txt)
          sed -i "s/<span class=\"app-hash\">[^<]*<\/span>/<span class=\"app-hash\">${SHORT_HASH}<\/span>/g" index.html safe.html || true
          sed -i "s/<span class=\"skred-version\">[^<]*<\/span>/<span class=\"skred-version\">${VERSION}<\/span>/g" index.html safe.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
