name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch WASM release
        run: |
          VERSION=$(cat WASM_VERSION.txt)
          curl -L -o wasm.zip "https://github.com/octetta/pulp/releases/download/v${VERSION}/skred-${VERSION}-maxed-wasm.zip"
          unzip -o wasm.zip "skred-${VERSION}-maxed/*"
          mv skred-${VERSION}-maxed/skred_api.* .
          rm -rf skred-${VERSION}-maxed wasm.zip
          if [ ! -f skred_api.wasm ]; then
             echo "Failed to extract wasm file"
             exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
