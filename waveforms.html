<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skred Built-in Waveforms</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    
    body {
        background-color: #0d1117;
        color: #00e5ff; /* Korg DW8000 cyan/blue */
        font-family: 'Press Start 2P', monospace;
        margin: 0;
        padding: 40px;
        line-height: 1.6;
        font-size: 10px;
    }
    h1 {
        text-align: center;
        text-shadow: 0 0 10px #00e5ff;
        font-size: 18px;
        margin-bottom: 30px;
    }
    .controls {
        text-align: center;
        margin-bottom: 20px;
        padding: 15px;
        background: #001a1a;
        border: 1px solid #00e5ff;
        border-radius: 8px;
        position: sticky;
        top: 20px;
        z-index: 100;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }
    .controls label {
        margin-right: 10px;
    }
    .controls input[type="number"] {
        background: #0d1117;
        border: 1px solid #00e5ff;
        color: #00e5ff;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        padding: 8px;
        width: 60px;
        text-align: center;
    }
    #manual-cmd {
        background: #000;
        border: 1px solid #00e5ff;
        color: #fff;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        padding: 8px;
        width: 350px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }
    .card {
        border: 1px solid #00e5ff;
        padding: 15px;
        border-radius: 8px;
        background: #001a1a;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        cursor: pointer;
        transition: all 0.2s;
    }
    .card:hover, .card:focus {
        background: #003333;
        border: 3px solid #00e5ff;
        padding: 13px;
        outline: none;
        transform: translateY(-2px);
    }
    .card h3 {
        margin-top: 0;
        margin-bottom: 15px;
        border-bottom: 1px dashed #00e5ff;
        padding-bottom: 8px;
        display: flex;
        justify-content: space-between;
        font-size: 10px;
    }
    .card .type {
        font-size: 8px;
        opacity: 0.7;
    }
    canvas {
        width: 100%;
        height: 100px;
        background: #0d1117;
        border: 1px solid #003333;
        image-rendering: pixelated;
    }
    .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #00e5ff;
        text-decoration: none;
        border: 1px solid #00e5ff;
        padding: 10px 15px;
        border-radius: 4px;
        transition: all 0.2s;
        font-size: 10px;
    }
    .back-link:hover {
        background: #00e5ff;
        color: #0d1117;
    }
    .loading { text-align: center; font-size: 1.2em; opacity: 0.8; margin-bottom: 20px; }
  </style>
</head>
<body>

  <a href="skode_reference.html" class="back-link">&larr; Back to Reference</a>
  <h1>Skred Built-in Waveforms</h1>
  
  <div class="controls">
      <div style="margin-bottom: 10px;">
          <label for="midi-note">Test Pitch (MIDI Note):</label>
          <input type="number" id="midi-note" value="69" min="0" max="127">
          <label for="main-vol" style="margin-left: 20px;">Main Vol:</label>
          <input type="number" id="main-vol" value="-6" max="10" step="1">
          <span style="margin-left: 15px; font-size: 8px; opacity: 0.8;">Click/Space plays</span>
      </div>
      <div style="margin-bottom: 10px;">
          <label for="manual-cmd">Manual Command:</label>
          <input type="text" id="manual-cmd" placeholder="e.g. v0 w15 a10 t 0 0 1 0 n69 l1">
      </div>
      <div style="font-size: 8px; color: #fff; background: #000; padding: 8px; border: 1px solid #003333; border-radius: 4px; display: inline-block; min-width: 350px; text-align: left;" id="cmd-display">
          > Waiting for input...
      </div>
  </div>

  <div id="loading" class="loading">Loading Engine & Decompressor...</div>
  
  <div class="grid" id="wave-grid"></div>

  <script src="wave_data.js"></script>
  <script src="https://unpkg.com/fflate@0.8.0/umd/index.js"></script>
  <script>
    let currentWaveData = "";
    let isCapturing = false;
    let currentVoice = 0;
    let firstClick = true;

    function playWave(wave) {
        if (!Module.ccall) return;
        
        if (firstClick && Module._skred_audio_reconnect) {
            Module._skred_audio_reconnect();
            firstClick = false;
        }
        const noteInput = document.getElementById('midi-note');
        const note = parseInt(noteInput.value) || 69;
        const voice = currentVoice;
        
        // Advance voice (0 through 15) to allow polyphony
        currentVoice = (currentVoice + 1) % 16;
        
        let cmd = "";
        if (wave.one_shot) {
            cmd = `S${voice} v${voice} w${wave.id} a10 t 0 0 1 0 n${note} l1`;
        } else {
            cmd = `S${voice} v${voice} w${wave.id} t 0.01 1 0 0 n${note} l1`;
        }
        
        console.log("Playing:", cmd);
        document.getElementById('cmd-display').innerText = "> " + cmd;
        Module.ccall('skred_command', null, ['string'], [cmd]);
    }

    var Module = {
      print: function(text) {
        if (text.startsWith("~WAVE:START")) {
          isCapturing = true;
          currentWaveData = "";
          return;
        }
        if (text.startsWith("~WAVE:END")) {
          isCapturing = false;
          return;
        }
        if (isCapturing && text.startsWith("~WAVE:")) {
          currentWaveData += text.substring(6);
          return;
        }
        console.log(text);
      },
      onRuntimeInitialized: function() {
        document.getElementById('loading').style.display = 'none';
        const grid = document.getElementById('wave-grid');
        
        // Initialize synth engine
        if (Module._skred_start) {
            Module._skred_start(128, 16, 0);
        }

        const manualCmd = document.getElementById('manual-cmd');
        if (manualCmd) {
            manualCmd.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const cmd = manualCmd.value.trim();
                    if (cmd) {
                        if (firstClick && Module._skred_audio_reconnect) {
                            Module._skred_audio_reconnect();
                            firstClick = false;
                        }
                        console.log("Manual Playing:", cmd);
                        document.getElementById('cmd-display').innerText = "> " + cmd;
                        Module.ccall('skred_command', null, ['string'], [cmd]);
                        manualCmd.value = "";
                    }
                }
            };
        }

        const mainVol = document.getElementById('main-vol');
        if (mainVol) {
            mainVol.onchange = (e) => {
                const cmd = `V${mainVol.value}`;
                if (firstClick && Module._skred_audio_reconnect) {
                    Module._skred_audio_reconnect();
                    firstClick = false;
                }
                console.log("Volume:", cmd);
                document.getElementById('cmd-display').innerText = "> " + cmd;
                Module.ccall('skred_command', null, ['string'], [cmd]);
            };
        }

        waves.forEach(wave => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('tabindex', '0'); // make focusable for keyboard
            
            card.onclick = () => playWave(wave);
            card.onkeydown = (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    playWave(wave);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (card.nextElementSibling && card.nextElementSibling.classList.contains('card')) {
                        card.nextElementSibling.focus();
                    }
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (card.previousElementSibling && card.previousElementSibling.classList.contains('card')) {
                        card.previousElementSibling.focus();
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const noteInput = document.getElementById('midi-note');
                    noteInput.value = Math.min(127, parseInt(noteInput.value || 69) + 1);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    const noteInput = document.getElementById('midi-note');
                    noteInput.value = Math.max(0, parseInt(noteInput.value || 69) - 1);
                }
            };
            
            const title = document.createElement('h3');
            title.innerHTML = `<span>W${wave.id}: ${wave.name}</span> <span class="type">${wave.type}</span>`;
            card.appendChild(title);
            
            const canvas = document.createElement('canvas');
            canvas.width = 300;
            canvas.height = 100;
            card.appendChild(canvas);
            grid.appendChild(card);
            
            // Extract wave using the API
            try {
                if (Module._skred_dump_wave_base64) {
                    currentWaveData = "";
                    isCapturing = false;
                    Module._skred_dump_wave_base64(wave.id);
                    
                    if (currentWaveData.length > 0) {
                        const binaryStr = window.atob(currentWaveData.trim());
                        const bytes = new Uint8Array(binaryStr.length);
                        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                        
                        const uncompressed = fflate.unzlibSync(bytes);
                        const floats = new Float32Array(uncompressed.buffer, uncompressed.byteOffset, uncompressed.byteLength / 4);
                        renderWave(canvas, floats);
                    } else {
                        renderError(canvas, "NO DATA");
                    }
                } else {
                    renderError(canvas, "API NOT FOUND");
                }
            } catch (e) {
                console.error("Error with wave", wave.id, e);
                renderError(canvas, "ERROR");
            }
        });
      }
    };

    function renderWave(canvas, floats) {
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        ctx.clearRect(0, 0, width, height);
        if (!floats || floats.length === 0) {
            renderError(canvas, "EMPTY");
            return;
        }
        
        ctx.beginPath();
        ctx.strokeStyle = '#00e5ff'; // DW8000 Cyan
        ctx.lineWidth = 1.5;
        
        const step = Math.max(1, floats.length / width);
        for (let x = 0; x < width; x++) {
            const index = Math.floor(x * step);
            if (index < floats.length) {
                const val = floats[index];
                const y = (1 - val) * (height / 2);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
        }
        ctx.stroke();
    }
    
    function renderError(canvas, text) {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ff0000';
        ctx.font = '10px "Press Start 2P"';
        ctx.fillText(text, 10, canvas.height/2 + 5);
    }
  </script>
  <script src="skred_api.js"></script>
</body>
</html>
